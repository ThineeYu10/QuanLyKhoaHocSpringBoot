<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Thông tin khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container">
    <a class="navbar-brand fw-bold" href="/courses">CourseManager</a>
</div></nav>
<main class="container py-5" style="max-width: 850px">
    <a href="/courses" class="text-decoration-none">&larr; Quay lại danh sách</a>
    <div class="card border-0 shadow-sm mt-3">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-4" th:text="${pageTitle}"></h1>
            <form method="post" th:action="${formAction}" th:object="${course}">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Tên khóa học *</label>
                        <input class="form-control" th:field="*{name}" placeholder="Ví dụ: Lập trình Java cơ bản">
                        <div class="text-danger small mt-1" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Giảng viên *</label>
                        <input class="form-control" th:field="*{instructor}" placeholder="Tên giảng viên">
                        <div class="text-danger small mt-1" th:errors="*{instructor}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Danh mục *</label>
                        <select class="form-select" th:field="*{category}">
                            <option value="">-- Chọn danh mục --</option>
                            <option value="Lập trình">Lập trình</option>
                            <option value="Cơ sở dữ liệu">Cơ sở dữ liệu</option>
                            <option value="Thiết kế">Thiết kế</option>
                            <option value="Tin học văn phòng">Tin học văn phòng</option>
                            <option value="Khác">Khác</option>
                        </select>
                        <div class="text-danger small mt-1" th:errors="*{category}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Học phí (VNĐ) *</label>
                        <input class="form-control" type="number" min="1" step="1000" th:field="*{price}" placeholder="Ví dụ: 1500000">
                        <div class="text-danger small mt-1" th:errors="*{price}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Thời lượng (giờ) *</label>
                        <input class="form-control" type="number" min="1" th:field="*{durationHours}" placeholder="Ví dụ: 30">
                        <div class="text-danger small mt-1" th:errors="*{durationHours}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-control" rows="4" th:field="*{description}" placeholder="Nội dung chính của khóa học..."></textarea>
                        <div class="text-danger small mt-1" th:errors="*{description}"></div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit">Lưu thông tin</button>
                    <a class="btn btn-outline-secondary" href="/courses">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
