<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary shadow-sm"><div class="container">
    <a class="navbar-brand fw-bold" href="/courses">CourseManager</a>
</div></nav>
<main class="container py-5" style="max-width: 850px">
    <a href="/courses" class="text-decoration-none">&larr; Quay lại danh sách</a>
    <div class="card border-0 shadow-sm mt-3">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex justify-content-between flex-wrap gap-2">
                <div><span class="badge text-bg-primary mb-2" th:text="${course.category}"></span>
                    <h1 class="h2" th:text="${course.name}"></h1></div>
                <span class="text-secondary">Mã khóa học: <strong th:text="${course.id}"></strong></span>
            </div>
            <hr>
            <dl class="row">
                <dt class="col-sm-4">Giảng viên</dt><dd class="col-sm-8" th:text="${course.instructor}"></dd>
                <dt class="col-sm-4">Học phí</dt><dd class="col-sm-8 fw-bold text-primary" th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></dd>
                <dt class="col-sm-4">Thời lượng</dt><dd class="col-sm-8" th:text="${course.durationHours} + ' giờ'"></dd>
                <dt class="col-sm-4">Mô tả</dt><dd class="col-sm-8" th:text="${course.description != null and !course.description.isBlank() ? course.description : 'Chưa có mô tả.'}"></dd>
            </dl>
            <a class="btn btn-primary" th:href="@{/courses/{id}/edit(id=${course.id})}">Chỉnh sửa</a>
            <a class="btn btn-outline-secondary" href="/courses">Danh sách</a>
        </div>
    </div>
</main>
</body>
</html>
